{% extends "base.html" %}

{% block title %}Demo-Test — Kyzo{% endblock %}

{% block content %}
<section class="demo-test-section">
  <div class="demo-test-container">
    <h1>Demo-Test starten</h1>

    {% if test_id %}
    <p class="demo-test__info">Test-ID: {{ test_id }}</p>
    {% else %}
    <p class="demo-test__info demo-test__info--placeholder">Keine Test-ID angegeben.</p>
    {% endif %}

    <!-- Session metadata -->
    <div id="session-metadata" class="demo-test__metadata"></div>

    <!-- Question area -->
    <div id="question-container" class="demo-test__question-area"></div>

    <!-- Completion message (shown when all_done is true) -->
    <div id="completion-message" class="demo-test__completion" style="display:none;"></div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  var API_URL = "{{ api_url }}";
</script>
<script src="{{ url_for('static', filename='js/test-demo-session.js') }}"></script>
<script>
  (function () {
    'use strict';
    var testId = '{{ test_id if test_id else "" }}';
    window.initTestDemo(testId || null);
  })();
</script>
{% endblock %}
